name: Publicar las pantallas y la página raíz en Cloudflare Pages

# El Panel, las dos aplicaciones de celular y la página raíz de careonys.com viven en
# Cloudflare Pages. Las tres primeras se arman con Vite y van en la matriz de abajo; la
# página raíz no es una aplicación y va en un job aparte, al final.
#
# Los cuatro son proyectos de
# "subida directa": no están enganchados a este repositorio, así que un `git push` NO las
# publica. Hasta el 2026-08-02 el despliegue era un comando a mano, y eso deja abierta la
# posibilidad de que el sitio en vivo se quede con una versión vieja sin que nada avise
# (ver CLAUDE.md §8). Este archivo cierra ese agujero: hace lo mismo que ya hace
# `deploy-backend.yml` para el motor del sistema.
#
# Cada aplicación se arma y se sube sola, y solo si su carpeta cambió.
#
# Lo que hace falta guardado en los secretos del repositorio:
#   CLOUDFLARE_API_TOKEN      token acotado "Despliegues Pages - CeltaTech" (solo Pages y DNS)
#   CLOUDFLARE_ACCOUNT_ID     la cuenta de Cloudflare donde viven los tres proyectos
#   CLOUDFLARE_ZONE_ID        la zona del dominio del producto. Sin él, la puerta de cada
#                             Prestadora no se puede dejar abierta desde acá y el trabajo lo
#                             dice y sigue.
#   VITE_SUPABASE_URL         \
#   VITE_SUPABASE_ANON_KEY     |  valores de producción que se compilan adentro de cada
#   VITE_API_URL               |  aplicación. Están acá porque los archivos .env.production
#   VITE_SITE_URL              |  no se versionan (CLAUDE.md §7.9).
#   VITE_VAPID_PUBLIC_KEY     /

on:
  push:
    branches: [main]
    paths:
      - 'panel/**'
      - 'pwa-familias/**'
      - 'pwa-asistentes/**'
      - 'sitio-web/**'
      - '.github/workflows/publicar-pantallas.yml'
  # También se puede disparar a mano desde la pestaña Actions, por si hace falta
  # volver a publicar sin cambiar código.
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    strategy:
      # Si una aplicación falla, las otras dos igual se publican.
      fail-fast: false
      matrix:
        include:
          - carpeta: panel
            proyecto: careonys-panel
          - carpeta: pwa-familias
            proyecto: careonys-familias
          - carpeta: pwa-asistentes
            proyecto: careonys-asistentes

    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: hace falta para comparar contra lo que había antes del push,
          # que puede traer varios cambios juntos, no uno solo.
          fetch-depth: 0

      - name: ¿Cambió esta aplicación?
        id: cambios
        env:
          ANTES: ${{ github.event.before }}
          AHORA: ${{ github.sha }}
        run: |
          # Ante cualquier duda se publica. Equivocarse publicando de más no rompe nada;
          # equivocarse publicando de menos deja el sitio en vivo con la versión vieja.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Disparado a mano: se publica igual."
            echo "hay=si" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$ANTES" 2>/dev/null; then
            echo "No puedo ver la versión anterior: publico por las dudas."
            echo "hay=si" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$ANTES" "$AHORA" | grep -q "^${{ matrix.carpeta }}/"; then
            echo "Cambió ${{ matrix.carpeta }}: se publica."
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "No cambió ${{ matrix.carpeta }}: no se toca lo que está publicado."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.cambios.outputs.hay == 'si'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.carpeta }}/package-lock.json

      - name: Instalar dependencias
        if: steps.cambios.outputs.hay == 'si'
        working-directory: ${{ matrix.carpeta }}
        run: npm ci

      - name: Armar la aplicación
        if: steps.cambios.outputs.hay == 'si'
        working-directory: ${{ matrix.carpeta }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Comprobar que quedó armada
        if: steps.cambios.outputs.hay == 'si'
        working-directory: ${{ matrix.carpeta }}
        run: |
          # Si el armado saliera vacío o sin portada, subirlo dejaría la aplicación
          # rota en vivo. Mejor frenar acá.
          test -f dist/index.html || { echo "No hay dist/index.html: no se sube nada."; exit 1; }

      - name: Subir a Cloudflare Pages
        if: steps.cambios.outputs.hay == 'si'
        working-directory: ${{ matrix.carpeta }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name=${{ matrix.proyecto }} --branch=main --commit-dirty=true

  # ---------------------------------------------------------------------------
  # La puerta de cada Prestadora.
  #
  # Cada Prestadora entra por su propia dirección —`cuidardelsur.careonys.com`—, y esa
  # dirección es la que le dice al Panel a cuál se está entrando. Publicar el Panel en una
  # sola dirección no alcanza: hay una por Prestadora y aparecen cada vez que se da una de
  # alta, así que no se pueden ir agregando de a una a mano.
  #
  # Lo que hace falta son dos cosas, y las dos son "para todas": que el nombre comodín
  # `*.<dominio del producto>` apunte al Panel, y que el proyecto del Panel acepte ese mismo
  # comodín como dirección propia. Sin la primera, la dirección no resuelve a ningún lado; sin
  # la segunda, resuelve y Cloudflare contesta que ese proyecto no atiende ahí.
  #
  # Se deja puesto, no se pisa: si el nombre comodín ya existe, no se toca —puede haber sido
  # apuntado a otra cosa a propósito—, se avisa y se sigue. Correrlo dos veces no cambia nada.
  # ---------------------------------------------------------------------------
  puerta-de-cada-prestadora:
    runs-on: ubuntu-latest
    needs: publicar
    steps:
      - uses: actions/checkout@v4

      - name: ¿Cuál es el dominio del producto?
        id: dominio
        run: |
          # Sale del único archivo donde vive la marca, nunca escrito a mano acá.
          DOMINIO=$(node -e "import('./panel/src/config/identidadProducto.js').then(m => console.log(m.IDENTIDAD.dominio))")
          test -n "$DOMINIO" || { echo "No se pudo leer el dominio del producto."; exit 1; }
          echo "valor=$DOMINIO" >> "$GITHUB_OUTPUT"

      - name: Dejar abierta la puerta de cada Prestadora
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DOMINIO: ${{ steps.dominio.outputs.valor }}
          PROYECTO: careonys-panel
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "Falta el secreto CLOUDFLARE_ZONE_ID: la puerta de cada Prestadora hay que"
            echo "dejarla abierta desde el panel de Cloudflare. Nada de lo publicado se toca."
            exit 0
          fi

          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          COMODIN="*.${DOMINIO}"

          # 1. El nombre comodín, que es lo que hace que la dirección resuelva a algún lado.
          EXISTE=$(curl -sS -H "$AUTH" \
            "$API/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${COMODIN}" \
            | node -e "let e='';process.stdin.on('data',d=>e+=d).on('end',()=>{const r=JSON.parse(e);console.log((r.result||[]).length)})")

          if [ "$EXISTE" = "0" ]; then
            echo "Creando el nombre comodín ${COMODIN}."
            curl -sS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              "$API/zones/${CLOUDFLARE_ZONE_ID}/dns_records" \
              --data "{\"type\":\"CNAME\",\"name\":\"*\",\"content\":\"${PROYECTO}.pages.dev\",\"proxied\":true}" \
              | node -e "let e='';process.stdin.on('data',d=>e+=d).on('end',()=>{const r=JSON.parse(e);if(!r.success){console.error('No se pudo crear el nombre comodín:',JSON.stringify(r.errors));process.exit(1)}console.log('Nombre comodín creado.')})"
          else
            echo "El nombre comodín ${COMODIN} ya existe: no se toca."
          fi

          # 2. Y que el proyecto del Panel conteste en ese nombre.
          YA_ESTA=$(curl -sS -H "$AUTH" \
            "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROYECTO}/domains" \
            | node -e "let e='';process.stdin.on('data',d=>e+=d).on('end',()=>{const r=JSON.parse(e);console.log((r.result||[]).some(d=>d.name==='${COMODIN}')?'si':'no')})")

          if [ "$YA_ESTA" = "no" ]; then
            echo "Agregando ${COMODIN} al proyecto ${PROYECTO}."
            curl -sS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROYECTO}/domains" \
              --data "{\"name\":\"${COMODIN}\"}" \
              | node -e "let e='';process.stdin.on('data',d=>e+=d).on('end',()=>{const r=JSON.parse(e);if(!r.success){console.error('No se pudo agregar la dirección al proyecto:',JSON.stringify(r.errors));process.exit(1)}console.log('Dirección agregada al proyecto.')})"
          else
            echo "El proyecto ${PROYECTO} ya contesta en ${COMODIN}."
          fi

  # ---------------------------------------------------------------------------
  # La página raíz de careonys.com (el cartel de "en construcción").
  #
  # Va aparte de la matriz porque no es una aplicación: es un HTML suelto, sin Vite y
  # sin dependencias, que `construir.mjs` arma resolviendo los marcadores del nombre
  # del producto. Hasta el 2026-08-18 se publicaba a mano, y pasó lo que tenía que
  # pasar: una corrección de texto quedó dos días en el repositorio sin llegar a la web.
  # ---------------------------------------------------------------------------
  publicar-sitio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Cambió la página raíz?
        id: cambios
        env:
          ANTES: ${{ github.event.before }}
          AHORA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Disparado a mano: se publica igual."
            echo "hay=si" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$ANTES" 2>/dev/null; then
            echo "No puedo ver la versión anterior: publico por las dudas."
            echo "hay=si" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$ANTES" "$AHORA" | grep -q "^sitio-web/"; then
            echo "Cambió sitio-web: se publica."
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "No cambió sitio-web: no se toca lo que está publicado."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.cambios.outputs.hay == 'si'
        with:
          node-version: '22'

      - name: Armar la página
        if: steps.cambios.outputs.hay == 'si'
        run: node sitio-web/construir.mjs

      - name: Comprobar que quedó armada
        if: steps.cambios.outputs.hay == 'si'
        run: |
          # Si el armado saliera vacío, subirlo dejaría la dirección del producto en
          # blanco. Mejor frenar acá.
          test -f sitio-web/dist/index.html || { echo "No hay sitio-web/dist/index.html: no se sube nada."; exit 1; }
          # Un marcador sin resolver significa que el nombre del producto no se aplicó.
          ! grep -q "{{producto}}" sitio-web/dist/index.html || { echo "Quedó un marcador sin resolver: no se sube nada."; exit 1; }

      - name: Subir a Cloudflare Pages
        if: steps.cambios.outputs.hay == 'si'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy sitio-web/dist --project-name=careonys-sitio --branch=main --commit-dirty=true
