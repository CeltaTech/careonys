name: Backup diario a buckets (R2 + B2)

# Sube el código entero, con toda su historia, a los dos depósitos de respaldo (Cloudflare R2
# como principal, Backblaze B2 como espejo). Estaba sólo en GitHub: una copia, en una cuenta, en
# manos de un tercero.
#
# Los datos y los archivos de las Prestadoras no se respaldan acá: los respalda el backend cada
# noche, de a una Prestadora y cifrados con la clave de cada una
# (backend/src/utils/respaldoDeLosDatos.js y backend/src/utils/copiaDeLosArchivos.js).
on:
  schedule:
    - cron: '0 6 * * *' # 03:00 America/Argentina/Buenos_Aires (UTC-3)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # La historia entera, no el último commit: el respaldo empaqueta el repositorio
          # completo, y con una copia recortada el paquete sale igual y no sirve para restaurar.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        working-directory: backend
        # `ci` y no `install`: install ignora el candado de versiones y se trae la última de cada
        # biblioteca, y una versión nueva puede romper el respaldo con un error que no tiene nada
        # que ver.
        run: npm ci --omit=dev

      - name: Ejecutar backup
        working-directory: backend
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: node scripts/backup_a_buckets.mjs
